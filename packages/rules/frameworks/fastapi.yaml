framework: fastapi
language: python
detect:
  pyproject.toml: [fastapi]
  requirements.txt: [fastapi]

roles:
  endpoint:
    route_handler: true
  dependency:
    all:
      - kind: function
      - injected: true # подава се в Depends(...)
  schema:
    any:
      - extends: pydantic.BaseModel
      - all: [{ kind: class }, { path_glob: ['**/schemas.py', '**/schemas/**'] }]
  entity:
    any:
      - extends: sqlalchemy.orm.DeclarativeBase
      - all:
          - decorator: dataclass
          - path_glob: ['**/models.py', '**/models/**', '**/entities/**']
  # конвенцията по файлове: services.py, payment_services.py, repository.py
  repository:
    any:
      - name_suffix: Repository
      - path_glob: ['**/repository.py', '**/repositories.py', '**/*_repository.py', '**/repositories/**']
  service:
    any:
      - name_suffix: Service
      - path_glob: ['**/services.py', '**/service.py', '**/*_services.py', '**/*_service.py', '**/services/**']

wiring:
  routes:
    decorators: [get, post, put, patch, delete, api_route]
    prefix: { assign: APIRouter, keyword: prefix }
    mount: { keyword: prefix }
