stack: python-fastapi
label: Python · FastAPI
language: python
bootstrap: pip install fastapi uvicorn
wiring: Include the module router in app/main.py with app.include_router; pass dependencies with Depends.
case: snake
module: '{entities_snake}'
class: { id: 'python:app.{Module}.{Folder}.{Name}', file: 'app/{Module}/{Folder}.py' }
folders:
  dto: schemas
  service: service
  use-case: use_cases
  port: ports
  repository: repository
  store: store
  entity: models
  message: messages
  handler: handlers
entry:
  per: endpoint
  kind: function
  name: '{action_snake}_{target_snake}'
  id: 'python:app.{Module}.router.{Name}'
  file: 'app/{Module}/router.py'
route: { param: '{*}' }
template: 'app/templates/{entities_snake}/{action_snake}.html'
# общите типове от входа и изхода на ендпойнтите в типовете на езика
types:
  id: int
  void: None
  string: str
  int: int
  float: float
  bool: bool
  date: date
  datetime: datetime
  object: dict
