# Как изглежда един участник от стила в този стек: id (същото като от адаптера), файл и вход.
# Променливи: {Entity} {Entities} {entity_snake} {entities_snake} {entity-kebab} {entities-kebab}
# {Action} {action} {action_snake} {action-kebab} {Target} {target_snake} {Message} {Module}
# {Folder} {Name} {dotted} {METHOD} {method} {path} {Entry}
stack: php-mezzio
label: PHP · Mezzio
language: php
# create-project иска празна папка, а в нея вече е .archgraph/
bootstrap: composer create-project mezzio/mezzio-skeleton .skeleton && cp -rn .skeleton/. . && rm -rf .skeleton
wiring: Всеки клас със зависимости се регистрира в ConfigProvider (`factories`), а route-ът — в config/routes.php.
case: camel
module: '{Entity}'
class: { id: 'php:App\{Module}\{Folder}\{Name}', file: 'src/{Module}/{Folder}/{Name}.php' }
folders:
  entry: Handler
  dto: Dto
  service: Service
  use-case: UseCase
  port: Port
  repository: Repository
  store: Infrastructure
  entity: Entity
  message: Application
  handler: Application
entry:
  per: endpoint
  kind: class
  name: '{Action}{Target}Handler'
  method: handle
  implements: RequestHandlerInterface
  inputs: [{ name: request, type: ServerRequestInterface }]
  output: ResponseInterface
route:
  { file: config/routes.php, param: '{*}', line: "$app->{method}('{path}', \\App\\{Module}\\Handler\\{Entry}::class);" }
template: 'templates/{entity-kebab}/{action-kebab}.phtml'
# общите типове от входа и изхода на ендпойнтите в типовете на езика
types:
  id: int
  void: void
  string: string
  int: int
  float: float
  bool: bool
  date: \DateTimeImmutable
  datetime: \DateTimeImmutable
# пълните имена на външните типове от входа: за `use` в скелета
imports:
  RequestHandlerInterface: Psr\Http\Server\RequestHandlerInterface
  ServerRequestInterface: Psr\Http\Message\ServerRequestInterface
  ResponseInterface: Psr\Http\Message\ResponseInterface
