stack: ts-nestjs
label: TypeScript · NestJS
language: node
bootstrap: npx @nestjs/cli new .
wiring: The controller and providers (service, repository) go into {Entities}Module, and the module into AppModule.
case: camel
module: '{entities-kebab}'
class: { id: 'node:{file}#{Name}', file: 'src/{Module}/{dotted}.ts' }
entry:
  per: entity
  kind: class
  name: '{Entities}Controller'
  file: 'src/{Module}/{Module}.controller.ts'
  method: '{action}'
route: { param: ':*' }
template: 'views/{entities-kebab}/{action-kebab}.hbs'
# общите типове от входа и изхода на ендпойнтите в типовете на езика
types:
  id: number
  void: void
  string: string
  int: number
  float: number
  bool: boolean
  date: Date
  datetime: Date
  object: 'Record<string, unknown>'
