style: hexagonal
label: Hexagonal (Ports & Adapters)
about: Входният port е договорът на действието, изходният — на съхранението. Адаптерите са отвън.
brief: The inbound port is the contract of the action, the outbound port that of storage. Adapters are on the outside.
entry: adapters
parts:
  command: { layer: ports, role: dto, name: '{Action}{Entity}Command', file: dto, per: endpoint, when: body }
  inport:
    {
      layer: ports,
      role: port,
      kind: interface,
      name: '{Action}{Target}UseCase',
      file: port,
      per: endpoint,
      method: execute,
    }
  service:
    {
      layer: application,
      role: service,
      name: '{Action}{Target}Service',
      file: service,
      per: endpoint,
      method: execute,
      implements: inport,
    }
  outport:
    { layer: ports, role: port, kind: interface, name: '{Entity}Repository', file: port, per: entity, method: storage }
  adapter:
    {
      layer: adapters,
      role: repository,
      name: 'Sql{Entity}Repository',
      file: repository,
      per: entity,
      method: storage,
      implements: outport,
    }
  entity: { layer: domain, role: entity, name: '{Entity}', file: entity, per: entity, method: domain }
flow:
  - { from: entry, to: command, kind: creates }
  - { from: entry, to: inport }
  - { from: service, to: outport }
  - { from: service, to: entity, when: write } # create (static), update и действията на агрегата
  - { from: adapter, to: entity, kind: creates }
# Нивото на ресурса: 3 — port и service за всяко действие; 2 — по един за ресурса; 1 — адаптерът вика
# изходния port направо.
levels:
  2:
    parts:
      inport: { name: '{Entity}UseCase', per: entity, method: action }
      service: { name: '{Entity}Service', per: entity, method: action }
  1:
    drop: [command, inport, service]
    flow:
      - { from: entry, to: outport }
      - { from: entry, to: entity, when: write }
