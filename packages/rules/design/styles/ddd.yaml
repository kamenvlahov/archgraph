style: ddd
label: DDD
about: Всеки ресурс е bounded context. Входът праща command или query; handler-ът работи с агрегата през repository.
entry: interfaces
parts:
  message: { layer: application, role: dto, name: '{Action}{Target}{Message}', file: message, per: endpoint }
  handler:
    {
      layer: application,
      role: service,
      name: '{Action}{Target}{Message}Handler',
      file: handler,
      per: endpoint,
      method: handle,
    }
  aggregate: { layer: domain, role: entity, name: '{Entity}', file: entity, per: entity, method: domain }
  repository:
    {
      layer: domain,
      role: repository,
      kind: interface,
      name: '{Entity}Repository',
      file: repository,
      per: entity,
      method: storage,
    }
  store:
    {
      layer: infrastructure,
      role: repository,
      name: 'Sql{Entity}Repository',
      file: store,
      per: entity,
      method: storage,
      implements: repository,
    }
flow:
  - { from: entry, to: message, kind: creates }
  - { from: entry, to: handler }
  - { from: handler, to: repository }
  - { from: handler, to: aggregate, when: write }
  - { from: store, to: aggregate, kind: creates }
# Нивото на ресурса (resources.X.level): 3 е стилът горе; 2 — един service за ресурса вместо command/query
# и handler за всяко действие; 1 — входът вика repository-то и агрегата направо.
levels:
  2:
    parts:
      message: { name: '{Action}{Entity}Dto', file: dto, when: body }
      handler: { name: '{Entity}Service', file: service, per: entity, method: action }
  1:
    drop: [message, handler]
    flow:
      - { from: entry, to: repository }
      - { from: entry, to: aggregate, when: write }
